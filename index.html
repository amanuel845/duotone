<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Asset Fetcher</title>
<style>
  :root{
    --bg:#f1f5f9;
    --surface:#ffffff;
    --line:#e2e8f0;
    --text:#0f172a;
    --muted:#64748b;
    --accent:#2563eb;
    --ok:#16a34a;
    --err:#dc2626;
    --code-bg:#0f172a;
    --code-fg:#cbd5e1;
    --radius:10px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}

  body{
    height:100vh;height:100dvh;
    overflow:hidden;
    display:flex;flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.4;color:var(--text);background:var(--bg);
    -webkit-tap-highlight-color:transparent;
  }

  /* ── HEADER ─────────────────────────────── */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:9px 12px;
    padding-top:calc(9px + env(safe-area-inset-top));
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .logo{
    flex:0 0 auto;width:22px;height:22px;border-radius:6px;
    background:var(--accent);color:#fff;display:grid;place-items:center;
    font-size:.72rem;font-weight:700;line-height:1;
  }
  header h1{font-size:.9rem;font-weight:650;letter-spacing:-.01em;white-space:nowrap;}
  .chip{
    margin-left:auto;font-size:.66rem;color:var(--muted);
    background:#f8fafc;border:1px solid var(--line);border-radius:999px;
    padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums;
  }

  /* ── TABS ───────────────────────────────── */
  .tabs{
    flex:0 0 auto;
    display:flex;gap:6px;
    padding:6px 10px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1 1 0;
    padding:8px 10px;
    font:inherit;font-size:.82rem;font-weight:600;
    color:var(--muted);
    background:#f8fafc;
    border:1px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s, transform .08s;
    -webkit-tap-highlight-color:transparent;
  }
  .tab:active{transform:scale(.985);}
  .tab.active{
    color:#fff;background:var(--accent);border-color:var(--accent);
  }

  /* ── MAIN ───────────────────────────────── */
  main{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:10px;
  }

  .panel{display:none;flex-direction:column;gap:10px;}
  .panel.active{display:flex;}

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px;
  }

  label{
    display:block;font-size:.66rem;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);margin-bottom:4px;
  }

  input[type="url"], input[type="text"]{
    width:100%;font:inherit;font-size:16px;padding:9px 10px;
    color:var(--text);background:#f8fafc;border:1px solid var(--line);
    border-radius:8px;outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type="url"]:focus, input[type="text"]:focus{
    background:#fff;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(37,99,235,.13);
  }
  input:disabled{opacity:.6;}
  .field + .field{margin-top:8px;}

  /* Toggles */
  .toggle-row{
    margin-top:10px;display:flex;align-items:center;gap:9px;
    padding:8px 10px;background:#f8fafc;border:1px solid var(--line);
    border-radius:8px;cursor:pointer;user-select:none;
  }
  .toggle-row input{position:absolute;opacity:0;pointer-events:none;}
  .switch{
    flex:0 0 auto;width:34px;height:20px;border-radius:999px;
    background:#cbd5e1;position:relative;transition:background .18s;
  }
  .switch::after{
    content:"";position:absolute;top:2px;left:2px;
    width:16px;height:16px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s;
  }
  .toggle-row input:checked ~ .switch{background:var(--accent);}
  .toggle-row input:checked ~ .switch::after{transform:translateX(14px);}
  .toggle-row input:disabled ~ .switch{opacity:.55;}
  .toggle-text{
    flex:1 1 auto;min-width:0;font-size:.78rem;color:var(--text);line-height:1.25;
  }
  .toggle-text code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;background:#eef2f7;padding:1px 5px;
    border-radius:4px;color:#334155;
  }
  .toggle-text small{
    display:block;font-size:.66rem;color:var(--muted);margin-top:1px;
  }

  button{
    width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;
    gap:8px;font:inherit;font-size:.9rem;font-weight:650;padding:11px 14px;
    color:#fff;background:var(--accent);border:none;border-radius:9px;
    cursor:pointer;transition:background .15s, transform .08s;
  }
  button:active:not(:disabled){transform:scale(.985);}
  button:disabled{opacity:.65;cursor:not-allowed;}

  .spinner{
    flex:0 0 auto;width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── PROGRESS ───────────────────────────── */
  .progress-card{padding:9px 10px 11px;}
  .progress-card:not([hidden]){margin-bottom:10px;}
  .progress-head{
    display:flex;justify-content:space-between;gap:8px;font-size:.68rem;
    color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums;
  }
  .progress-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar{position:relative;height:6px;border-radius:999px;background:#e2e8f0;overflow:hidden;}
  .bar > i{
    display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#3b82f6,#2563eb);
    transition:width .15s linear;
  }
  .bar.indet > i{width:35% !important;transition:none;animation:slide 1.15s ease-in-out infinite;}
  @keyframes slide{0%{transform:translateX(-110%);}100%{transform:translateX(320%);}}
  .bar.done > i{background:linear-gradient(90deg,#22c55e,#16a34a);}
  .bar.fail > i{background:linear-gradient(90deg,#f87171,#dc2626);width:100% !important;}

  /* ── LIST CARDS (fonts + js files) ──────── */
  .fonts-card{padding:0;overflow:hidden;}
  .fonts-list{
    list-style:none;max-height:38vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .fonts-list li{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    border-bottom:1px solid var(--line);font-size:.75rem;
  }
  .fonts-list li:last-child{border-bottom:none;}
  .fonts-list li input[type="checkbox"]{
    flex:0 0 auto;margin:0;cursor:pointer;
    accent-color:var(--accent);
    width:16px;height:16px;
  }
  .fdot{
    flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#cbd5e1;
  }
  .fdot.loading{background:var(--accent);animation:pulse 1s ease-in-out infinite;}
  .fdot.ok{background:var(--ok);}
  .fdot.err{background:var(--err);}
  .fname{
    flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.72rem;color:#334155;
  }
  .fsize{
    flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.68rem;
  }

  .js-toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    background:#fafbfc;
    font-size:.72rem;color:var(--muted);
  }
  .js-selectall{
    display:flex;align-items:center;gap:6px;
    cursor:pointer;user-select:none;
    font-weight:600;color:var(--text);margin:0;
    text-transform:none;letter-spacing:0;font-size:.75rem;
  }
  .js-selectall input[type="checkbox"]{
    margin:0;cursor:pointer;accent-color:var(--accent);
    width:16px;height:16px;
  }
  .js-count{font-variant-numeric:tabular-nums;}

  /* ── PREVIEW ────────────────────────────── */
  .preview-card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .card-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-bottom:1px solid var(--line);
    font-size:.66rem;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);
  }
  .card-head .meta{
    font-weight:500;font-size:.66rem;letter-spacing:0;text-transform:none;
    color:var(--muted);font-variant-numeric:tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    max-width:60%;text-align:right;
  }
  pre{
    margin:0;padding:10px;max-height:32vh;min-height:100px;overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--code-bg);color:var(--code-fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:11px;line-height:1.55;white-space:pre;tab-size:2;
  }
  pre::-webkit-scrollbar{width:7px;height:7px;}
  pre::-webkit-scrollbar-thumb{background:#334155;border-radius:999px;}
  pre::-webkit-scrollbar-track{background:transparent;}

  /* ── FOOTER ─────────────────────────────── */
  footer{
    flex:0 0 auto;display:flex;align-items:flex-start;gap:7px;
    padding:8px 12px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line);
    font-size:.72rem;line-height:1.35;color:var(--muted);
  }
  .dot{
    flex:0 0 auto;width:7px;height:7px;margin-top:4px;border-radius:50%;
    background:#94a3b8;
  }
  .dot.loading{background:var(--accent);animation:pulse 1s ease-in-out infinite;}
  .dot.ok{background:var(--ok);}
  .dot.err{background:var(--err);}
  @keyframes pulse{50%{opacity:.25;}}

  #status{
    flex:1 1 auto;min-width:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
  }
</style>
</head>
<body>

  <!-- ══════════ HEADER ══════════ -->
  <header>
    <span class="logo" aria-hidden="true">⬇</span>
    <h1>Asset Fetcher</h1>
    <span class="chip" id="sizeChip">idle</span>
  </header>

  <!-- ══════════ TABS ══════════ -->
  <nav class="tabs" role="tablist" aria-label="Mode">
    <button class="tab active" data-panel="css" role="tab" aria-selected="true">CSS + Fonts</button>
    <button class="tab" data-panel="js" role="tab" aria-selected="false">JS Directory</button>
  </nav>

  <!-- ══════════ MAIN ══════════ -->
  <main>

    <!-- Shared progress -->
    <section class="card progress-card" id="progressCard" hidden>
      <div class="progress-head">
        <span id="pLeft">0 B</span>
        <span id="pRight"></span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-label="Progress">
        <i id="barFill"></i>
      </div>
    </section>

    <!-- ══════════ PANEL 1: CSS + Fonts ══════════ -->
    <div class="panel active" id="panel-css" role="tabpanel">

      <section class="card">
        <div class="field">
          <label for="url">Target URL</label>
          <input id="url" type="url" inputmode="url"
                 autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false"
                 enterkeyhint="go"
                 placeholder="https://example.com/style.css">
        </div>

        <div class="field">
          <label for="fname">Download file name</label>
          <input id="fname" type="text"
                 autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false"
                 enterkeyhint="go"
                 placeholder="duotone.min.css">
        </div>

        <label class="toggle-row" for="useProxy">
          <input type="checkbox" id="useProxy" checked>
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text">
            Use API proxy <code>api/fetch.js</code>
            <small>Bypasses CORS for the CSS <em>and</em> its fonts.</small>
          </span>
        </label>

        <label class="toggle-row" for="bundleFonts">
          <input type="checkbox" id="bundleFonts" checked>
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text">
            Bundle fonts into a ZIP
            <small>Extracts <code>url(...)</code> from <code>@font-face</code> and packages everything.</small>
          </span>
        </label>

        <button id="go" type="button">
          <span id="btnLabel">Fetch &amp; Download</span>
        </button>
      </section>

      <section class="card fonts-card" id="fontsCard" hidden>
        <div class="card-head">
          <span>Fonts</span>
          <span class="meta" id="fontsMeta">—</span>
        </div>
        <ul class="fonts-list" id="fontsList"></ul>
      </section>

      <section class="card preview-card">
        <div class="card-head">
          <span>Preview</span>
          <span class="meta" id="meta">—</span>
        </div>
        <pre id="preview"><code>// Fetched CSS content will appear here.</code></pre>
      </section>

    </div>

    <!-- ══════════ PANEL 2: JS Directory ══════════ -->
    <div class="panel" id="panel-js" role="tabpanel">

      <section class="card">
        <div class="field">
          <label for="jsDir">Directory URL</label>
          <input id="jsDir" type="url" inputmode="url"
                 autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false"
                 enterkeyhint="go"
                 placeholder="https://example.com/assets/js/">
        </div>

        <label class="toggle-row" for="jsUseProxy">
          <input type="checkbox" id="jsUseProxy" checked>
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text">
            Use API proxy <code>api/fetch.js</code>
            <small>Required if the directory or files are cross-origin.</small>
          </span>
        </label>

        <button id="jsListBtn" type="button">
          <span id="jsListLabel">List JS files</span>
        </button>
      </section>

      <section class="card fonts-card" id="jsFilesCard" hidden>
        <div class="card-head">
          <span>JS files</span>
          <span class="meta" id="jsFilesMeta">—</span>
        </div>
        <div class="js-toolbar">
          <label class="js-selectall">
            <input type="checkbox" id="jsSelectAll" checked>
            <span>Select all</span>
          </label>
          <span class="js-count" id="jsCount">0 / 0</span>
        </div>
        <ul class="fonts-list" id="jsFilesList"></ul>
      </section>

      <section class="card" id="jsActionsCard" hidden>
        <button id="jsZipBtn" type="button">
          <span id="jsZipLabel">Download selected as ZIP</span>
        </button>
      </section>

    </div>

  </main>

  <!-- ══════════ FOOTER ══════════ -->
  <footer>
    <span class="dot" id="dot" aria-hidden="true"></span>
    <span id="status" role="status" aria-live="polite">Ready.</span>
  </footer>

<script>
(function () {
  "use strict";

  /* ── Defaults ───────────────────────────────────────────── */
  const DEFAULT_CSS_URL  = "https://www.library.illinois.edu/assets/fontawesome/css/duotone.min.css";
  const DEFAULT_CSS_NAME = "duotone.min.css";
  const DEFAULT_JS_DIR   = "https://www.library.illinois.edu/assets/js/";
  const PROXY_PATH       = "/api/fetch";

  /* ── Elements ───────────────────────────────────────────── */
  const $ = (id) => document.getElementById(id);

  // Shared
  const progressCard = $("progressCard");
  const bar          = $("bar");
  const barFill      = $("barFill");
  const pLeft        = $("pLeft");
  const pRight       = $("pRight");
  const sizeChip     = $("sizeChip");
  const dot          = $("dot");
  const statusEl     = $("status");

  // Tab 1 (CSS)
  const urlInput     = $("url");
  const fnameInput   = $("fname");
  const useProxy     = $("useProxy");
  const bundleFonts  = $("bundleFonts");
  const goBtn        = $("go");
  const btnLabel     = $("btnLabel");
  const fontsCard    = $("fontsCard");
  const fontsList    = $("fontsList");
  const fontsMeta    = $("fontsMeta");
  const previewEl    = $("preview");
  const metaEl       = $("meta");

  // Tab 2 (JS)
  const jsDirInput     = $("jsDir");
  const jsUseProxy     = $("jsUseProxy");
  const jsListBtn      = $("jsListBtn");
  const jsListLabel    = $("jsListLabel");
  const jsFilesCard    = $("jsFilesCard");
  const jsFilesList    = $("jsFilesList");
  const jsFilesMeta    = $("jsFilesMeta");
  const jsSelectAll    = $("jsSelectAll");
  const jsCount        = $("jsCount");
  const jsActionsCard  = $("jsActionsCard");
  const jsZipBtn       = $("jsZipBtn");
  const jsZipLabel     = $("jsZipLabel");

  /* ── Init defaults ──────────────────────────────────────── */
  urlInput.value   = DEFAULT_CSS_URL;
  fnameInput.value = DEFAULT_CSS_NAME;
  jsDirInput.value = DEFAULT_JS_DIR;

  let fnameTouched = false;
  fnameInput.addEventListener("input", () => { fnameTouched = true; });
  urlInput.addEventListener("input", () => {
    if (!fnameTouched) fnameInput.value = deriveName(urlInput.value);
  });

  /* ── Shared utilities ───────────────────────────────────── */
  const encoder = new TextEncoder();

  function deriveName(rawUrl) {
    try {
      const u = new URL(rawUrl.trim());
      const seg = u.pathname.split("/").filter(Boolean).pop();
      return seg ? decodeURIComponent(seg) : "download.css";
    } catch { return "download.css"; }
  }

  function fmtBytes(n) {
    if (!Number.isFinite(n) || n < 0) return "—";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(2) + " MB";
  }

  function sanitizeFilename(name) {
    return (name || "")
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_")
      .replace(/^\.+/, "")
      .trim() || "download";
  }

  function normalizeUrl(href) {
    const u = new URL(href);
    u.hash = "";
    return u.href;
  }

  function setState(state, message) {
    dot.className = "dot" +
      (state === "loading" ? " loading" :
       state === "ok"      ? " ok"      :
       state === "err"     ? " err"     : "");
    statusEl.textContent = message;
  }

  function showProgress(show) { progressCard.hidden = !show; }

  function resetProgress() {
    bar.classList.remove("done", "fail", "indet");
    barFill.style.width = "0%";
    pLeft.textContent  = "0 B";
    pRight.textContent = "";
  }

  function setProgress(received, total) {
    if (total > 0) {
      bar.classList.remove("indet");
      const pct = Math.min(100, (received / total) * 100);
      barFill.style.width = pct.toFixed(1) + "%";
      pRight.textContent  = pct.toFixed(0) + "%";
      pLeft.textContent   = fmtBytes(received) + " / " + fmtBytes(total);
    } else {
      bar.classList.add("indet");
      pRight.textContent = "";
      pLeft.textContent  = received ? fmtBytes(received) : "0 B";
    }
  }

  function buildPreview(text) {
    const src = (text || "").trim();
    if (!src) return "// (empty file)";
    const HEAD = 900, TAIL = 300;
    if (src.length <= HEAD + TAIL) return src;
    const omitted = src.length - HEAD - TAIL;
    return (
      src.slice(0, HEAD).trimEnd() +
      "\n\n/* ⋯ " + omitted.toLocaleString() + " more characters omitted ⋯ */\n\n" +
      src.slice(-TAIL).trimStart()
    );
  }

  function triggerDownload(blob, filename) {
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = filename;
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(objectUrl); }, 1500);
  }

  function buildFetchUrl(targetUrl, viaProxy) {
    if (!viaProxy) return targetUrl;
    return PROXY_PATH + "?url=" + encodeURIComponent(targetUrl);
  }

  async function fetchWithProgress(fetchUrl, onProgress) {
    const response = await fetch(fetchUrl, {
      method: "GET", mode: "cors", credentials: "omit",
      cache: "no-cache", redirect: "follow"
    });

    if (!response.ok) {
      let detail = "";
      try {
        const ct = response.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
          const j = await response.json();
          detail = j && (j.error || j.detail) ? " — " + (j.error || j.detail) : "";
        }
      } catch (_) {}
      throw new Error("HTTP " + response.status + " " + response.statusText + detail);
    }

    const contentType = response.headers.get("Content-Type") || "";
    const declared    = Number(response.headers.get("Content-Length")) || 0;

    if (!response.body || typeof response.body.getReader !== "function") {
      const blob = await response.blob();
      onProgress(blob.size, blob.size);
      return { blob, type: contentType };
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    onProgress(0, declared);

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      onProgress(received, declared);
    }

    const blob = new Blob(chunks, { type: contentType || "application/octet-stream" });
    return { blob, type: contentType };
  }

  /* ── Tab switching ─────────────────────────────────────── */
  const tabs = document.querySelectorAll(".tab");
  const panels = { css: $("panel-css"), js: $("panel-js") };

  tabs.forEach((t) => {
    t.addEventListener("click", () => {
      if (t.classList.contains("active")) return;
      tabs.forEach((x) => {
        const on = x === t;
        x.classList.toggle("active", on);
        x.setAttribute("aria-selected", on ? "true" : "false");
      });
      Object.keys(panels).forEach((k) => {
        panels[k].classList.toggle("active", k === t.dataset.panel);
      });
      showProgress(false);           // avoid stale progress when switching
      setState("idle", "Ready.");
      sizeChip.textContent = "idle";
    });
  });

  /* ═══════════════════════════════════════════════════════════
     TAB 1 — CSS + FONTS
     ═══════════════════════════════════════════════════════════ */

  function busyCss(on) {
    goBtn.disabled       = on;
    urlInput.disabled    = on;
    fnameInput.disabled  = on;
    useProxy.disabled    = on;
    bundleFonts.disabled = on;

    const existing = goBtn.querySelector(".spinner");
    if (on) {
      if (!existing) {
        const s = document.createElement("span");
        s.className = "spinner";
        goBtn.insertBefore(s, btnLabel);
      }
      btnLabel.textContent = "Fetching…";
    } else {
      if (existing) existing.remove();
      btnLabel.textContent = "Fetch & Download";
    }
  }

  const URL_RE = /url\(\s*(['"]?)([^'")]+?)\1\s*\)/gi;
  const FONT_EXT_RE = /\.(woff2?|ttf|otf|eot|svg)([?#].*)?$/i;

  function extractFontUrls(cssText, cssBaseUrl) {
    const out = [];
    const seen = new Set();
    let m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(cssText)) !== null) {
      const raw = (m[2] || "").trim();
      if (!raw) continue;
      if (raw.startsWith("data:") || raw.startsWith("#") || raw.startsWith("blob:")) continue;
      if (!FONT_EXT_RE.test(raw)) continue;

      let resolved;
      try { resolved = normalizeUrl(new URL(raw, cssBaseUrl).href); }
      catch { continue; }
      if (seen.has(resolved)) continue;
      seen.add(resolved);

      let basename;
      try {
        const u = new URL(resolved);
        basename = decodeURIComponent(u.pathname.split("/").pop() || "font.bin");
      } catch { basename = "font.bin"; }

      out.push({ raw, resolved, basename });
    }

    const counts = new Map();
    for (const f of out) {
      const n = counts.get(f.basename) || 0;
      counts.set(f.basename, n + 1);
      if (n > 0) {
        const d = f.basename.lastIndexOf(".");
        f.zipName = d > 0
          ? f.basename.slice(0, d) + "_" + n + f.basename.slice(d)
          : f.basename + "_" + n;
      } else {
        f.zipName = f.basename;
      }
      f.zipPath = "webfonts/" + f.zipName;
    }
    return out;
  }

  function rewriteCssUrls(cssText, cssBaseUrl, fontByUrl) {
    URL_RE.lastIndex = 0;
    return cssText.replace(URL_RE, (match, q, raw) => {
      const trimmed = (raw || "").trim();
      if (!trimmed) return match;
      if (trimmed.startsWith("data:") || trimmed.startsWith("#") || trimmed.startsWith("blob:")) return match;
      let resolved;
      try { resolved = normalizeUrl(new URL(trimmed, cssBaseUrl).href); }
      catch { return match; }
      const f = fontByUrl.get(resolved);
      if (!f || !f.data) return match;
      return 'url("' + f.zipPath + '")';
    });
  }

  function renderFonts(fonts) {
    fontsList.textContent = "";
    for (const f of fonts) {
      const li = document.createElement("li");
      li.title = f.resolved;

      const d = document.createElement("span");
      d.className = "fdot";

      const n = document.createElement("span");
      n.className = "fname";
      n.textContent = f.zipName;

      const s = document.createElement("span");
      s.className = "fsize";
      s.textContent = "…";

      li.append(d, n, s);
      fontsList.appendChild(li);
      f._el = { d, s };
    }
    fontsCard.hidden = false;
    fontsMeta.textContent = fonts.length + " found";
  }

  function updateFontUi(f, state, size) {
    if (!f._el) return;
    f._el.d.className = "fdot" + (state ? " " + state : "");
    if (typeof size === "number") f._el.s.textContent = fmtBytes(size);
    else if (state === "err") f._el.s.textContent = "failed";
  }

  async function runCss() {
    const rawUrl  = urlInput.value.trim();
    const name    = sanitizeFilename(fnameInput.value);
    const proxy   = useProxy.checked;
    const bundle  = bundleFonts.checked;

    let parsed;
    try { parsed = new URL(rawUrl); }
    catch {
      setState("err", "Invalid URL — please enter a full http(s) address.");
      urlInput.focus();
      return;
    }
    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
      setState("err", "Only http:// and https:// URLs are supported.");
      urlInput.focus();
      return;
    }

    busyCss(true);
    setState("loading", (proxy ? "Proxying · " : "Direct · ") + parsed.hostname + "…");
    showProgress(true);
    resetProgress();
    fontsCard.hidden = true;
    fontsList.textContent = "";
    metaEl.textContent = "—";
    previewEl.textContent = "// Fetching CSS…";

    try {
      const cssFetchUrl = buildFetchUrl(rawUrl, proxy);
      const { blob: cssBlob, type: cssType } = await fetchWithProgress(cssFetchUrl, setProgress);
      const cssText = await cssBlob.text();

      bar.classList.add("done");
      barFill.style.width = "100%";
      const shortCssType = (cssType || "text/css").split(";")[0];
      metaEl.textContent = shortCssType + " · " + fmtBytes(cssBlob.size) + (proxy ? " · proxied" : "");
      sizeChip.textContent = fmtBytes(cssBlob.size);

      if (!bundle) {
        triggerDownload(cssBlob, name);
        previewEl.textContent = buildPreview(cssText);
        setState("ok", "Saved “" + name + "” (" + fmtBytes(cssBlob.size) + ")" + (proxy ? " via proxy" : ""));
        return;
      }

      const fonts = extractFontUrls(cssText, rawUrl);

      if (fonts.length === 0) {
        triggerDownload(cssBlob, name);
        previewEl.textContent = buildPreview(cssText);
        setState("ok", "No fonts found — saved CSS only (" + fmtBytes(cssBlob.size) + ")");
        return;
      }

      renderFonts(fonts);
      setState("loading", fonts.length + " font" + (fonts.length === 1 ? "" : "s") + " to fetch…");

      const byUrl = new Map();
      for (const f of fonts) byUrl.set(f.resolved, f);

      let okCount = 0, failCount = 0;

      for (let i = 0; i < fonts.length; i++) {
        const f = fonts[i];
        updateFontUi(f, "loading");
        setState("loading", "Font " + (i + 1) + "/" + fonts.length + " · " + f.zipName);
        resetProgress();
        bar.classList.add("indet");

        try {
          const fontFetchUrl = buildFetchUrl(f.resolved, proxy);
          const { blob: fb } = await fetchWithProgress(fontFetchUrl, setProgress);
          const data = new Uint8Array(await fb.arrayBuffer());
          f.data = data;
          okCount++;
          bar.classList.remove("indet");
          bar.classList.add("done");
          barFill.style.width = "100%";
          updateFontUi(f, "ok", data.length);
        } catch (err) {
          console.warn("Font fetch failed:", f.resolved, err);
          f.error = err && err.message ? err.message : String(err);
          failCount++;
          bar.classList.remove("indet");
          bar.classList.add("fail");
          updateFontUi(f, "err");
        }
      }

      const rewritten = rewriteCssUrls(cssText, rawUrl, byUrl);
      const cssBytes = encoder.encode(rewritten);

      const zipFiles = [{ name, data: cssBytes }];
      for (const f of fonts) if (f.data) zipFiles.push({ name: f.zipPath, data: f.data });

      const zipBlob = buildZip(zipFiles);
      const zipName = name.replace(/\.[^.]*$/, "") + ".zip";
      triggerDownload(zipBlob, zipName);

      fontsMeta.textContent = okCount + " ok" + (failCount ? " · " + failCount + " failed" : "");
      previewEl.textContent = buildPreview(rewritten);
      metaEl.textContent =
        shortCssType + " + " + okCount + " font" + (okCount === 1 ? "" : "s") +
        " · " + fmtBytes(zipBlob.size);
      sizeChip.textContent = fmtBytes(zipBlob.size);

      const summary =
        "ZIP saved “" + zipName + "” (" + fmtBytes(zipBlob.size) + ")" +
        (failCount ? " · " + failCount + " font" + (failCount === 1 ? "" : "s") + " failed" : "");
      setState(failCount && !okCount ? "err" : "ok", summary);

    } catch (err) {
      console.error(err);
      bar.classList.remove("indet", "done");
      bar.classList.add("fail");
      barFill.style.width = "100%";
      pRight.textContent  = "";
      sizeChip.textContent = "failed";

      let msg = "Failed: " + (err && err.message ? err.message : String(err));
      if (!proxy && err instanceof TypeError && /failed to fetch|networkerror/i.test(err.message)) {
        msg += " — likely CORS. Enable the API proxy and try again.";
      } else if (proxy && /HTTP 5\d\d/.test(msg)) {
        msg += " — check the /api/fetch deployment logs.";
      }
      previewEl.textContent = "// " + msg;
      metaEl.textContent = "error";
      setState("err", msg);
    } finally {
      busyCss(false);
    }
  }

  /* ═══════════════════════════════════════════════════════════
     TAB 2 — JS DIRECTORY (Method 1: parse HTML listing)
     ═══════════════════════════════════════════════════════════ */

  let jsFiles = [];  // { url, basename, checked, data, _el }

  function busyJs(on) {
    jsListBtn.disabled   = on;
    jsZipBtn.disabled    = on;
    jsDirInput.disabled  = on;
    jsUseProxy.disabled  = on;
    jsSelectAll.disabled = on;

    const existing = jsListBtn.querySelector(".spinner");
    if (on) {
      if (!existing) {
        const s = document.createElement("span");
        s.className = "spinner";
        jsListBtn.insertBefore(s, jsListLabel);
      }
      jsListLabel.textContent = "Working…";
    } else {
      if (existing) existing.remove();
      jsListLabel.textContent = "List JS files";
    }
  }

  /**
   * Method 1: fetch a directory URL, parse the returned HTML index page,
   * collect every <a href> that resolves to a .js file.
   */
  async function listJsFiles(dirUrl, viaProxy) {
    const fetchUrl = buildFetchUrl(dirUrl, viaProxy);
    const res = await fetch(fetchUrl, {
      method: "GET", mode: "cors", credentials: "omit",
      cache: "no-cache", redirect: "follow"
    });

    if (!res.ok) {
      let detail = "";
      try {
        const ct = res.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
          const j = await res.json();
          detail = " — " + (j.error || j.detail || JSON.stringify(j));
        }
      } catch (_) {}
      throw new Error("HTTP " + res.status + " " + res.statusText + detail);
    }

    const ct   = res.headers.get("content-type") || "";
    const html = await res.text();

    // Sanity check: does this even look like a directory listing?
    if (!/html/i.test(ct) && !/<a\s/i.test(html)) {
      throw new Error("Server did not return an HTML directory listing.");
    }

    const doc   = new DOMParser().parseFromString(html, "text/html");
    const links = doc.querySelectorAll("a[href]");
    const seen  = new Set();
    const out   = [];

    for (const a of links) {
      const href = (a.getAttribute("href") || "").trim();
      if (!href) continue;
      if (href.startsWith("#") || href.startsWith("?")) continue;
      // skip parent/current directory entries
      if (href === "/" || href === "./" || href === "../") continue;

      let resolved;
      try { resolved = new URL(href, dirUrl); }
      catch { continue; }

      // Only .js files
      if (!/\.js(\?|#|$)/i.test(resolved.pathname)) continue;

      const clean = resolved.origin + resolved.pathname;   // drop ?query and #hash
      if (seen.has(clean)) continue;
      seen.add(clean);

      let basename;
      try {
        basename = decodeURIComponent(resolved.pathname.split("/").pop() || "file.js");
      } catch { basename = "file.js"; }

      out.push({ url: clean, basename });
    }

    out.sort((a, b) => a.basename.localeCompare(b.basename));
    return out;
  }

  function deriveZipBase(dirUrl) {
    try {
      const u = new URL(dirUrl);
      const segs = u.pathname.split("/").filter(Boolean);
      const last = segs.length ? segs[segs.length - 1] : u.hostname.replace(/\./g, "-");
      return sanitizeFilename(last || "assets");
    } catch { return "assets"; }
  }

  function renderJsFiles(files) {
    jsFilesList.textContent = "";
    jsFiles = files.map((f) => ({ ...f, checked: true }));

    for (const f of jsFiles) {
      const li = document.createElement("li");
      li.title = f.url;

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.addEventListener("change", () => {
        f.checked = cb.checked;
        updateJsCount();
      });

      const d = document.createElement("span");
      d.className = "fdot";

      const n = document.createElement("span");
      n.className = "fname";
      n.textContent = f.basename;

      const s = document.createElement("span");
      s.className = "fsize";
      s.textContent = "—";

      li.append(cb, d, n, s);
      jsFilesList.appendChild(li);
      f._el = { cb, d, s };
    }

    jsFilesCard.hidden   = false;
    jsActionsCard.hidden = false;
    jsFilesMeta.textContent = files.length + " found";
    jsSelectAll.checked  = true;
    jsSelectAll.indeterminate = false;
    updateJsCount();
  }

  function updateJsCount() {
    const sel = jsFiles.filter((f) => f.checked).length;
    jsCount.textContent = sel + " / " + jsFiles.length;
    jsSelectAll.checked = sel > 0 && sel === jsFiles.length;
    jsSelectAll.indeterminate = sel > 0 && sel < jsFiles.length;
  }

  function updateJsRow(f, state, size) {
    if (!f._el) return;
    f._el.d.className = "fdot" + (state ? " " + state : "");
    if (typeof size === "number") f._el.s.textContent = fmtBytes(size);
    else if (state === "err")     f._el.s.textContent = "failed";
    else if (state === "loading") f._el.s.textContent = "…";
  }

  jsSelectAll.addEventListener("change", () => {
    const on = jsSelectAll.checked;
    for (const f of jsFiles) {
      f.checked = on;
      if (f._el) f._el.cb.checked = on;
    }
    updateJsCount();
  });

  async function runJsList() {
    const rawUrl = jsDirInput.value.trim();
    const proxy  = jsUseProxy.checked;

    let parsed;
    try { parsed = new URL(rawUrl); }
    catch {
      setState("err", "Invalid directory URL.");
      jsDirInput.focus();
      return;
    }
    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
      setState("err", "Only http:// and https:// URLs are supported.");
      return;
    }

    busyJs(true);
    setState("loading", "Listing " + parsed.hostname + "…");
    showProgress(true);
    resetProgress();
    bar.classList.add("indet");
    jsFilesCard.hidden   = true;
    jsActionsCard.hidden = true;
    jsFilesList.textContent = "";
    jsFiles = [];

    try {
      const files = await listJsFiles(rawUrl, proxy);

      bar.classList.remove("indet");
      bar.classList.add("done");
      barFill.style.width = "100%";
      pLeft.textContent  = files.length + " file" + (files.length === 1 ? "" : "s");
      pRight.textContent = "";

      if (files.length === 0) {
        setState("err", "No .js files found in the directory listing.");
        jsFilesCard.hidden   = true;
        jsActionsCard.hidden = true;
        return;
      }

      renderJsFiles(files);
      setState("ok", "Found " + files.length + " JS file" + (files.length === 1 ? "" : "s") + ".");
      sizeChip.textContent = files.length + " files";

    } catch (err) {
      console.error(err);
      bar.classList.remove("indet", "done");
      bar.classList.add("fail");
      barFill.style.width = "100%";
      let msg = "Failed: " + (err && err.message ? err.message : String(err));
      if (!proxy && err instanceof TypeError && /failed to fetch|networkerror/i.test(err.message)) {
        msg += " — likely CORS. Enable the API proxy and try again.";
      }
      setState("err", msg);
      sizeChip.textContent = "failed";
    } finally {
      busyJs(false);
    }
  }

  async function runJsZip() {
    const proxy    = jsUseProxy.checked;
    const selected = jsFiles.filter((f) => f.checked);

    if (selected.length === 0) {
      setState("err", "No files selected.");
      return;
    }

    busyJs(true);
    setState("loading", "Downloading " + selected.length + " file" + (selected.length === 1 ? "" : "s") + "…");
    showProgress(true);

    const zipFiles = [];
    let okCount = 0, failCount = 0;

    for (let i = 0; i < selected.length; i++) {
      const f = selected[i];
      updateJsRow(f, "loading");
      setState("loading", "File " + (i + 1) + "/" + selected.length + " · " + f.basename);
      resetProgress();
      bar.classList.add("indet");

      try {
        const { blob } = await fetchWithProgress(buildFetchUrl(f.url, proxy), setProgress);
        const data = new Uint8Array(await blob.arrayBuffer());
        f.data = data;
        okCount++;
        bar.classList.remove("indet");
        bar.classList.add("done");
        barFill.style.width = "100%";
        updateJsRow(f, "ok", data.length);
        zipFiles.push({ name: f.basename, data });
      } catch (err) {
        console.warn("JS fetch failed:", f.url, err);
        failCount++;
        bar.classList.remove("indet", "done");
        bar.classList.add("fail");
        updateJsRow(f, "err");
      }
    }

    if (zipFiles.length === 0) {
      setState("err", "All downloads failed.");
      busyJs(false);
      return;
    }

    const zipBlob = buildZip(zipFiles);
    const zipName = deriveZipBase(jsDirInput.value.trim()) + ".zip";
    triggerDownload(zipBlob, zipName);

    jsFilesMeta.textContent = okCount + " ok" + (failCount ? " · " + failCount + " failed" : "");
    sizeChip.textContent = fmtBytes(zipBlob.size);

    setState(
      failCount && !okCount ? "err" : "ok",
      "ZIP saved “" + zipName + "” (" + fmtBytes(zipBlob.size) + ")" +
      (failCount ? " · " + failCount + " failed" : "")
    );
    busyJs(false);
  }

  /* ── Minimal STORE-only ZIP writer (shared) ─────────────── */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function dosDateTime(d) {
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    return { date: date & 0xFFFF, time: time & 0xFFFF };
  }

  function buildZip(files) {
    const now = dosDateTime(new Date());
    const local = [];
    const central = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = encoder.encode(f.name);
      const data = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data);
      const crc = crc32(data);
      const size = data.length;

      const lh = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, now.time, true);
      lv.setUint16(12, now.date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);

      local.push(lh, data);

      const cd = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, now.time, true);
      cv.setUint16(14, now.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);

      central.push(cd);
      offset += lh.length + data.length;
    }

    const cdSize = central.reduce((s, c) => s + c.length, 0);
    const cdOffset = offset;

    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, central.length, true);
    ev.setUint16(10, central.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, cdOffset, true);
    ev.setUint16(20, 0, true);

    return new Blob([...local, ...central, eocd], { type: "application/zip" });
  }

  /* ── Event wiring ──────────────────────────────────────── */
  goBtn.addEventListener("click", runCss);
  jsListBtn.addEventListener("click", runJsList);
  jsZipBtn.addEventListener("click", runJsZip);

  [urlInput, fnameInput].forEach((el) => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); runCss(); }
    });
  });

  jsDirInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); runJsList(); }
  });

  /* Prevent double-tap zoom on iOS (extra safety) */
  let lastTouch = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

})();
</script>
</body>
</html>
