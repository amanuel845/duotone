<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Asset Fetcher</title>
<style>
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--ok:#16a34a;--err:#dc2626;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent}
header,nav,footer{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 12px}
header{padding-top:calc(9px + env(safe-area-inset-top))}
header{display:flex;align-items:center;gap:8px}
h1{font-size:.9rem;font-weight:650;white-space:nowrap}
.chip{margin-left:auto;font-size:.66rem;color:var(--muted);background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums}
nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px}
.tab{padding:8px 6px;font:inherit;font-size:.74rem;font-weight:600;color:var(--muted);background:#f8fafc;border:1px solid var(--line);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s,border-color .15s,transform .08s}
.tab:active{transform:scale(.985)}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px}
.panel{display:none;flex-direction:column;gap:10px}
.panel.active{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.card.nopad{padding:0;overflow:hidden}
label{display:block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input[type=url],input[type=text]{width:100%;padding:9px 10px;color:var(--text);background:#f8fafc;border:1px solid var(--line);border-radius:8px;outline:none;font:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
input:disabled{opacity:.6}
.field + .field{margin-top:8px}
.toggle{position:relative;display:flex;align-items:center;gap:9px;padding:8px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;cursor:pointer;user-select:none;margin-top:8px;font-size:.78rem;line-height:1.25}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.switch{position:relative;width:34px;height:20px;border-radius:999px;background:#cbd5e1;transition:background .18s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.toggle input:checked ~ .switch{background:var(--accent)}
.toggle input:checked ~ .switch::after{transform:translateX(14px)}
.toggle input:disabled ~ .switch{opacity:.55}
.toggle code{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;background:#eef2f7;padding:1px 5px;border-radius:4px;color:#334155}
.toggle small{display:block;font-size:.66rem;color:var(--muted);margin-top:1px}
button{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;color:#fff;background:var(--accent);border:0;border-radius:9px;cursor:pointer;font:inherit;font-size:.9rem;font-weight:650;transition:background .15s,transform .08s}
button:active:not(:disabled){transform:scale(.985)}
button:disabled{opacity:.65;cursor:not-allowed}
.spinner{flex:0 0 auto;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-card{padding:9px 10px 11px}
.progress-card:not([hidden]){margin-bottom:10px}
.progress-head{display:flex;justify-content:space-between;gap:8px;font-size:.68rem;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.progress-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:6px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.bar > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#2563eb);transition:width .15s linear}
.bar.indet > i{width:35% !important;transition:none;animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
.bar.done > i{background:linear-gradient(90deg,#22c55e,#16a34a)}
.bar.fail > i{background:linear-gradient(90deg,#f87171,#dc2626);width:100% !important}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card-head .meta{font-weight:500;font-size:.66rem;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;text-align:right}
.fonts-list{list-style:none;max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.font-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:.75rem}
.font-item:first-child{border-top:0}
.font-item input[type=checkbox]{flex:0 0 auto;width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.fdot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#cbd5e1}
.fdot.loading{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.fdot.ok{background:var(--ok)}
.fdot.err{background:var(--err)}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:#334155}
.fsize{flex:0 0 auto;color:var(--muted);font-size:.68rem;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.25}}
.tree-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:#fafbfc;font-size:.72rem;color:var(--muted)}
.tree-toolbar label{margin:0;text-transform:none;letter-spacing:0;font-size:.75rem;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;cursor:pointer}
.tree-toolbar input[type=checkbox]{margin:0;width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.tree-list,.tree-children{list-style:none;margin:0;padding:0}
.tree-list{max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
.tree-children{display:none;padding-left:8px;margin-left:12px;border-left:1px solid var(--line)}
.tree-children.open{display:block}
.tree-item{border-top:1px solid var(--line)}
.tree-item:first-child{border-top:0}
.tree-row{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:.75rem}
.tree-row.dir{cursor:pointer;user-select:none;transition:background .12s}
.tree-row.dir:hover{background:#f8fafc}
.tree-row input[type=checkbox]{flex:0 0 auto;width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.tree-tri{flex:0 0 auto;width:14px;text-align:center;font-size:.72rem;color:var(--muted);user-select:none;font-family:ui-monospace,Menlo,monospace}
.tree-dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#cbd5e1}
.tree-dot.dir{background:#f59e0b;width:8px;height:8px}
.tree-dot.loading{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.tree-dot.ok{background:var(--ok)}
.tree-dot.err{background:var(--err)}
.tree-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:#334155}
.tree-name.dir{color:#b45309;font-weight:600}
.tree-size{flex:0 0 auto;color:var(--muted);font-size:.68rem;font-variant-numeric:tabular-nums}
pre{margin:0;padding:10px;max-height:32vh;min-height:100px;overflow:auto;background:#0f172a;color:#cbd5e1;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.55;white-space:pre;tab-size:2}
footer{border-bottom:0;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:7px;padding-bottom:calc(9px + env(safe-area-inset-bottom));font-size:.72rem;line-height:1.35;color:var(--muted)}
.dot{flex:0 0 auto;width:7px;height:7px;margin-top:4px;border-radius:50%;background:#94a3b8}
.dot.load{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.dot.ok{background:var(--ok)}
.dot.err{background:var(--err)}
#status{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
</style>
</head>
<body>

<header>
  <h1>Asset Fetcher</h1>
  <span class="chip" id="sizeChip">idle</span>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-panel="css"   type="button">CSS + Fonts</button>
  <button class="tab"        data-panel="all"   type="button">All Assets</button>
  <button class="tab"        data-panel="js"    type="button">Remote JS</button>
  <button class="tab"        data-panel="local" type="button">Local JS</button>
</nav>

<main>

<section class="card progress-card" id="progressCard" hidden>
  <div class="progress-head"><span id="pLeft">0 B</span><span id="pRight"></span></div>
  <div class="bar" id="bar"><i id="barFill"></i></div>
</section>

<!-- TAB 1 -->
<div class="panel active" id="panel-css">
  <section class="card">
    <div class="field">
      <label for="url">Target URL</label>
      <input id="url" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="fname">Download file name</label>
      <input id="fname" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <label class="toggle" for="useProxy">
      <input type="checkbox" id="useProxy" checked>
      <span class="switch"></span>
      <span>Use API proxy <code>api/fetch.js</code><small>Bypasses CORS for CSS and fonts.</small></span>
    </label>
    <label class="toggle" for="bundleFonts">
      <input type="checkbox" id="bundleFonts" checked>
      <span class="switch"></span>
      <span>Bundle fonts into ZIP<small>Parses <code>url(...)</code> from <code>@font-face</code>.</small></span>
    </label>
    <button id="go" type="button"><span id="btnLabel">Fetch &amp; Download</span></button>
  </section>
  <section class="card nopad" id="fontsCard" hidden>
    <div class="card-head"><span>Fonts</span><span class="meta" id="fontsMeta">-</span></div>
    <ul class="fonts-list" id="fontsList"></ul>
  </section>
  <section class="card nopad">
    <div class="card-head"><span>Preview</span><span class="meta" id="meta">-</span></div>
    <pre id="preview">// Fetched CSS content appears here.</pre>
  </section>
</div>

<!-- TAB 2 -->
<div class="panel" id="panel-all">
  <section class="card">
    <div class="field">
      <label for="allDir">Directory URL</label>
      <input id="allDir" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <label class="toggle" for="allServerScan">
      <input type="checkbox" id="allServerScan" checked>
      <span class="switch"></span>
      <span>Server-side scan <code>api/list-remote.js</code><small>One request from browser; server walks tree in parallel.</small></span>
    </label>
    <label class="toggle" for="allUseProxy">
      <input type="checkbox" id="allUseProxy" checked>
      <span class="switch"></span>
      <span>Use API proxy <code>api/fetch.js</code><small>Only used when server scan is off.</small></span>
    </label>
    <button id="allListBtn" type="button"><span id="allListLabel">Load tree</span></button>
  </section>
  <section class="card nopad" id="allFilesCard" hidden>
    <div class="card-head"><span>Assets</span><span class="meta" id="allFilesMeta">-</span></div>
    <div class="tree-toolbar">
      <label for="allSelectAll"><input type="checkbox" id="allSelectAll" checked> Select all</label>
      <span id="allCount">0 / 0</span>
    </div>
    <ul class="tree-list" id="allFilesList"></ul>
  </section>
  <section class="card" id="allActionsCard" hidden>
    <button id="allZipBtn" type="button"><span id="allZipLabel">Download selected as ZIP</span></button>
  </section>
</div>

<!-- TAB 3 -->
<div class="panel" id="panel-js">
  <section class="card">
    <div class="field">
      <label for="jsDir">Directory URL</label>
      <input id="jsDir" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <label class="toggle" for="jsUseProxy">
      <input type="checkbox" id="jsUseProxy" checked>
      <span class="switch"></span>
      <span>Use API proxy <code>api/fetch.js</code><small>Required for cross-origin directories.</small></span>
    </label>
    <button id="jsListBtn" type="button"><span id="jsListLabel">List JS files</span></button>
  </section>
  <section class="card nopad" id="jsFilesCard" hidden>
    <div class="card-head"><span>JS files</span><span class="meta" id="jsFilesMeta">-</span></div>
    <div class="tree-toolbar">
      <label for="jsSelectAll"><input type="checkbox" id="jsSelectAll" checked> Select all</label>
      <span id="jsCount">0 / 0</span>
    </div>
    <ul class="fonts-list" id="jsFilesList"></ul>
  </section>
  <section class="card" id="jsActionsCard" hidden>
    <button id="jsZipBtn" type="button"><span id="jsZipLabel">Download selected as ZIP</span></button>
  </section>
</div>

<!-- TAB 4 -->
<div class="panel" id="panel-local">
  <section class="card">
    <div class="field">
      <label for="localDir">Path inside /public</label>
      <input id="localDir" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <label class="toggle" for="localRecursive">
      <input type="checkbox" id="localRecursive">
      <span class="switch"></span>
      <span>Include subdirectories<small>Reads nested folders under the path.</small></span>
    </label>
    <button id="localListBtn" type="button"><span id="localListLabel">List JS files</span></button>
  </section>
  <section class="card nopad" id="localFilesCard" hidden>
    <div class="card-head"><span>Local files</span><span class="meta" id="localFilesMeta">-</span></div>
    <div class="tree-toolbar">
      <label for="localSelectAll"><input type="checkbox" id="localSelectAll" checked> Select all</label>
      <span id="localCount">0 / 0</span>
    </div>
    <ul class="fonts-list" id="localFilesList"></ul>
  </section>
  <section class="card" id="localActionsCard" hidden>
    <button id="localZipBtn" type="button"><span id="localZipLabel">Download selected as ZIP</span></button>
  </section>
</div>

</main>

<footer>
  <span class="dot" id="dot"></span>
  <span id="status" role="status" aria-live="polite">Ready.</span>
</footer>

<!-- ===== BLOCK 1: shared utilities ===== -->
<script>
var PROXY = "https://duotone-nine.vercel.app/api/fetch";
var LIST_LOCAL = "https://duotone-nine.vercel.app/api/list-js";
var LIST_REMOTE = "https://duotone-nine.vercel.app/api/list-remote";

function $(id){ return document.getElementById(id); }

function fmt(n){
  if(!isFinite(n) || n < 0) return "-";
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(2) + " MB";
}

function safeName(n){
  return (n || "").replace(/[\\/:*?"<>|]/g, "_").replace(/^\.+/, "").trim() || "download";
}

function dl(blob, name){
  var u = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = u; a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(u); }, 1000);
}

function fetchUrl(u, proxy){ return proxy ? PROXY + "?url=" + encodeURIComponent(u) : u; }

function httpGet(u){
  return fetch(u, { method: "GET", mode: "cors", credentials: "omit", cache: "no-cache" });
}
function getText(u){
  return httpGet(u).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
}
function getBlob(u){
  return httpGet(u).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.blob();
  });
}
function getJSON(u){
  return httpGet(u).then(function(r){
    return r.json().then(function(j){ return { ok: r.ok, status: r.status, data: j }; });
  });
}

var statusEl = $("status"), dotEl = $("dot"), chipEl = $("sizeChip");
function setStatus(state, msg){
  var c = "dot";
  if(state === "ok") c += " ok";
  else if(state === "err") c += " err";
  else if(state === "load") c += " load";
  dotEl.className = c;
  statusEl.textContent = msg;
}

var progressCard = $("progressCard"), barEl = $("bar"), barFill = $("barFill");
var pLeft = $("pLeft"), pRight = $("pRight");
function showProgress(on){ progressCard.hidden = !on; }
function resetProgress(){
  barEl.classList.remove("done", "fail", "indet");
  barFill.style.width = "0%";
  pLeft.textContent = "0 B";
  pRight.textContent = "";
}
function setProgress(recv, total){
  if(total > 0){
    barEl.classList.remove("indet");
    var pct = Math.min(100, (recv/total)*100);
    barFill.style.width = pct.toFixed(1) + "%";
    pRight.textContent = pct.toFixed(0) + "%";
    pLeft.textContent = fmt(recv) + " / " + fmt(total);
  } else {
    barEl.classList.add("indet");
    pRight.textContent = "";
    pLeft.textContent = recv ? fmt(recv) : "0 B";
  }
}

function getWithProgress(u, onProgress){
  return httpGet(u).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    var ct = r.headers.get("Content-Type") || "";
    var total = Number(r.headers.get("Content-Length")) || 0;
    if(!r.body || typeof r.body.getReader !== "function"){
      return r.blob().then(function(b){
        onProgress(b.size, b.size);
        return { blob: b, type: ct };
      });
    }
    var reader = r.body.getReader(), chunks = [], recv = 0;
    onProgress(0, total);
    function pump(){
      return reader.read().then(function(x){
        if(x.done){
          var b = new Blob(chunks, { type: ct || "application/octet-stream" });
          return { blob: b, type: ct };
        }
        chunks.push(x.value);
        recv += x.value.length;
        onProgress(recv, total);
        return pump();
      });
    }
    return pump();
  });
}

function parseIndex(html, base){
  var doc = new DOMParser().parseFromString(html, "text/html");
  var links = doc.querySelectorAll("a[href]");
  var out = [], seen = {}, baseObj = new URL(base);
  Array.prototype.forEach.call(links, function(a){
    var h = (a.getAttribute("href") || "").trim();
    if(!h) return;
    if(h.charAt(0) === "#" || h.charAt(0) === "?") return;
    if(h === "/" || h === "./" || h === "../") return;
    var u;
    try { u = new URL(h, base); } catch(e){ return; }
    if(u.origin !== baseObj.origin) return;
    var isDir = u.pathname.slice(-1) === "/";
    var clean = u.origin + u.pathname;
    if(seen[clean]) return;
    seen[clean] = 1;
    var name = "";
    try { name = decodeURIComponent(u.pathname.replace(/\/$/, "").split("/").pop() || ""); } catch(e){}
    if(!name) return;
    out.push({ url: clean, name: name, isDir: isDir });
  });
  return out;
}

function initTabs(){
  var tabs = document.querySelectorAll(".tab");
  var panels = { css: $("panel-css"), all: $("panel-all"), js: $("panel-js"), local: $("panel-local") };
  Array.prototype.forEach.call(tabs, function(t){
    t.addEventListener("click", function(){
      Array.prototype.forEach.call(tabs, function(x){ x.classList.toggle("active", x === t); });
      Object.keys(panels).forEach(function(k){
        panels[k].classList.toggle("active", k === t.getAttribute("data-panel"));
      });
      showProgress(false);
    });
  });
}

var CRC_TABLE = (function(){
  var t = new Uint32Array(256);
  for(var n = 0; n < 256; n++){
    var c = n;
    for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(b){
  var c = 0xFFFFFFFF;
  for(var i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
var ENC = new TextEncoder();
function makeZip(files){
  var d = new Date();
  var dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  var dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  var local = [], cent = [], off = 0;
  files.forEach(function(f){
    var nb = ENC.encode(f.name);
    var data = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data);
    var crc = crc32(data), sz = data.length;
    var lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true); lv.setUint16(8, 0, true);
    lv.setUint16(10, dt, true); lv.setUint16(12, dd, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, sz, true); lv.setUint32(22, sz, true);
    lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
    lh.set(nb, 30);
    local.push(lh, data);
    var cd = new Uint8Array(46 + nb.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true); cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true); cv.setUint16(12, dt, true); cv.setUint16(14, dd, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, sz, true); cv.setUint32(24, sz, true);
    cv.setUint16(28, nb.length, true); cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true); cv.setUint16(34, 0, true); cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true); cv.setUint32(42, off, true);
    cd.set(nb, 46);
    cent.push(cd);
    off += lh.length + data.length;
  });
  var cdsz = 0;
  cent.forEach(function(c){ cdsz += c.length; });
  var eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, cent.length, true); ev.setUint16(10, cent.length, true);
  ev.setUint32(12, cdsz, true); ev.setUint32(16, off, true); ev.setUint16(20, 0, true);
  var all = local.concat(cent); all.push(eocd);
  return new Blob(all, { type: "application/zip" });
}

<script>
(function(){
  "use strict";

  var urlI = $("url"), fnameI = $("fname"), useProxy = $("useProxy"), bundleEl = $("bundleFonts");
  var goBtn = $("go"), btnLabel = $("btnLabel");
  var fontsCard = $("fontsCard"), fontsList = $("fontsList"), fontsMeta = $("fontsMeta");
  var previewEl = $("preview"), metaEl = $("meta");

  urlI.value = "https://www.library.illinois.edu/assets/fontawesome/css/duotone.min.css";
  fnameI.value = "duotone.min.css";

  var URL_RE = /url\(\s*(['"]?)([^'")]+?)\1\s*\)/gi;
  var FONT_RE = /\.(woff2?|ttf|otf|eot|svg)([?#].*)?$/i;

  function extractFonts(css, base){
    var out = [], seen = {}, m;
    URL_RE.lastIndex = 0;
    while((m = URL_RE.exec(css))){
      var r = (m[2] || "").trim();
      if(!r) continue;
      if(r.indexOf("data:") === 0) continue;
      if(r.charAt(0) === "#") continue;
      if(r.indexOf("blob:") === 0) continue;
      if(!FONT_RE.test(r)) continue;
      var u;
      try { u = new URL(r, base).href.replace(/#.*$/, ""); } catch(e){ continue; }
      if(seen[u]) continue;
      seen[u] = 1;
      var n = "font.bin";
      try { n = decodeURIComponent(new URL(u).pathname.split("/").pop() || "font.bin"); } catch(e){}
      out.push({ url: u, name: n });
    }
    var counts = {};
    out.forEach(function(f){
      var c = counts[f.name] || 0;
      counts[f.name] = c + 1;
      if(c > 0){
        var d = f.name.lastIndexOf(".");
        f.zipName = d > 0 ? f.name.slice(0, d) + "_" + c + f.name.slice(d) : f.name + "_" + c;
      } else {
        f.zipName = f.name;
      }
      f.zipPath = "webfonts/" + f.zipName;
    });
    return out;
  }

  function rewrite(css, base, map){
    URL_RE.lastIndex = 0;
    return css.replace(URL_RE, function(m, q, r){
      r = (r || "").trim();
      if(!r) return m;
      if(r.indexOf("data:") === 0) return m;
      if(r.charAt(0) === "#") return m;
      if(r.indexOf("blob:") === 0) return m;
      var u;
      try { u = new URL(r, base).href.replace(/#.*$/, ""); } catch(e){ return m; }
      var f = map[u];
      if(!f || !f.data) return m;
      return 'url("' + f.zipPath + '")';
    });
  }

  function renderFonts(fonts){
    fontsList.textContent = "";
    fonts.forEach(function(f){
      var li = document.createElement("li");
      li.className = "font-item";
      var dot = document.createElement("span");
      dot.className = "fdot";
      var nm = document.createElement("span");
      nm.className = "fname";
      nm.textContent = f.zipName;
      var sz = document.createElement("span");
      sz.className = "fsize";
      sz.textContent = "...";
      li.appendChild(dot); li.appendChild(nm); li.appendChild(sz);
      fontsList.appendChild(li);
      f._dot = dot;
      f._sz = sz;
    });
    fontsCard.hidden = false;
    fontsMeta.textContent = fonts.length + " found";
  }

  function updateRow(f, state, size){
    if(f._dot) f._dot.className = "fdot" + (state ? " " + state : "");
    if(typeof size === "number" && f._sz) f._sz.textContent = fmt(size);
    else if(state === "err" && f._sz) f._sz.textContent = "failed";
  }

  function busy(on){
    goBtn.disabled = urlI.disabled = fnameI.disabled = useProxy.disabled = bundleEl.disabled = on;
    var s = goBtn.querySelector(".spinner");
    if(on){
      if(!s){
        s = document.createElement("span");
        s.className = "spinner";
        goBtn.insertBefore(s, btnLabel);
      }
      btnLabel.textContent = "Fetching...";
    } else {
      if(s) s.parentNode.removeChild(s);
      btnLabel.textContent = "Fetch & Download";
    }
  }

  function previewOf(text){
    var s = (text || "").trim();
    if(!s) return "// (empty)";
    var H = 1200, T = 400;
    if(s.length <= H + T) return s;
    return s.slice(0, H).replace(/\s+$/, "") +
      "\n\n/* ... " + (s.length - H - T) + " more chars ... */\n\n" +
      s.slice(-T).replace(/^\s+/, "");
  }

  function run(){
    var raw = urlI.value.trim();
    var name = safeName(fnameI.value);
    var proxy = useProxy.checked;
    var bundle = bundleEl.checked;
    var p;
    try { p = new URL(raw); } catch(e){ setStatus("err", "Invalid URL"); return; }
    if(p.protocol !== "http:" && p.protocol !== "https:"){ setStatus("err", "Only http(s)"); return; }

    busy(1);
    setStatus("load", (proxy ? "Proxying" : "Direct") + " - " + p.hostname);
    showProgress(true);
    resetProgress();
    fontsCard.hidden = true;
    fontsList.textContent = "";
    metaEl.textContent = "-";
    previewEl.textContent = "// fetching...";

    var cssBlob = null, cssText = "", cssType = "";

    getWithProgress(fetchUrl(raw, proxy), setProgress)
      .then(function(r){
        cssBlob = r.blob;
        cssType = r.type;
        return r.blob.text();
      })
      .then(function(text){
        cssText = text;
        barEl.classList.remove("indet");
        barEl.classList.add("done");
        barFill.style.width = "100%";
        var t = (cssType || "text/css").split(";")[0];
        metaEl.textContent = t + " - " + fmt(cssBlob.size) + (proxy ? " - proxied" : "");
        chipEl.textContent = fmt(cssBlob.size);

        if(!bundle){
          dl(cssBlob, name);
          previewEl.textContent = previewOf(cssText);
          setStatus("ok", "Saved " + name + " (" + fmt(cssBlob.size) + ")");
          return null;
        }

        var fonts = extractFonts(cssText, raw);
        if(!fonts.length){
          dl(cssBlob, name);
          previewEl.textContent = previewOf(cssText);
          setStatus("ok", "No fonts - saved CSS only");
          return null;
        }

        renderFonts(fonts);
        setStatus("load", fonts.length + " fonts to fetch");

        var map = {};
        fonts.forEach(function(f){ map[f.url] = f; });
        var ok = 0, fail = 0;
        var chain = Promise.resolve();

        fonts.forEach(function(f, i){
          chain = chain.then(function(){
            updateRow(f, "loading");
            setStatus("load", "Font " + (i + 1) + "/" + fonts.length + " - " + f.zipName);
            resetProgress();
            barEl.classList.add("indet");
            return getWithProgress(fetchUrl(f.url, proxy), setProgress)
              .then(function(fr){ return fr.blob.arrayBuffer(); })
              .then(function(buf){
                f.data = new Uint8Array(buf);
                ok++;
                barEl.classList.remove("indet");
                barEl.classList.add("done");
                barFill.style.width = "100%";
                updateRow(f, "ok", f.data.length);
              })
              .catch(function(){
                fail++;
                barEl.classList.remove("indet", "done");
                barEl.classList.add("fail");
                updateRow(f, "err");
              });
          });
        });

        return chain.then(function(){
          var rewritten = rewrite(cssText, raw, map);
          var zipFiles = [{ name: name, data: ENC.encode(rewritten) }];
          fonts.forEach(function(f){
            if(f.data) zipFiles.push({ name: f.zipPath, data: f.data });
          });
          var z = makeZip(zipFiles);
          var zname = name.replace(/\.[^.]*$/, "") + ".zip";
          dl(z, zname);
          fontsMeta.textContent = ok + " ok" + (fail ? " - " + fail + " failed" : "");
          previewEl.textContent = previewOf(rewritten);
          metaEl.textContent = t + " + " + ok + " fonts - " + fmt(z.size);
          chipEl.textContent = fmt(z.size);
          setStatus(ok && !fail ? "ok" : (fail && !ok ? "err" : "ok"),
            "ZIP " + fmt(z.size) + " - " + ok + " ok, " + fail + " failed");
          return null;
        });
      })
      .catch(function(err){
        barEl.classList.remove("indet", "done");
        barEl.classList.add("fail");
        barFill.style.width = "100%";
        pRight.textContent = "";
        var msg = "Failed: " + (err && err.message ? err.message : String(err));
        if(!proxy && err instanceof TypeError && /failed to fetch/i.test(err.message || "")){
          msg += " - likely CORS";
        }
        previewEl.textContent = "// " + msg;
        metaEl.textContent = "error";
        setStatus("err", msg);
      })
      .then(function(){ busy(0); });
  }

  goBtn.addEventListener("click", run);
  urlI.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); run(); } });
  fnameI.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); run(); } });
})();
console.log("[boot] block 2 ok");
</script>

<!-- ===== BLOCK 3: Tab 2 All Assets tree ===== -->
<script>
(function(){
  "use strict";

  var dirI = $("allDir"), srvToggle = $("allServerScan"), proxyToggle = $("allUseProxy");
  var btn = $("allListBtn"), lbl = $("allListLabel"), zipBtn = $("allZipBtn"), zipLabel = $("allZipLabel");
  var card = $("allFilesCard"), list = $("allFilesList"), metaEl = $("allFilesMeta");
  var allCb = $("allSelectAll"), countEl = $("allCount"), actionsCard = $("allActionsCard");

  dirI.value = "https://www.library.illinois.edu/assets/";
  var tree = null;

  function countFiles(n){
    if(n.type === "file") return 1;
    var s = 0;
    n.children.forEach(function(c){ s += countFiles(c); });
    return s;
  }
  function countDirs(n){
    if(n.type === "file") return 0;
    var s = 0;
    n.children.forEach(function(c){ s += (c.type === "dir" ? 1 : 0) + countDirs(c); });
    return s;
  }
  function setChecked(n, v){
    if(n.type === "file"){
      n.checked = v;
      if(n._cb) n._cb.checked = v;
    } else {
      n.children.forEach(function(c){ setChecked(c, v); });
      if(n._cb && n !== tree){
        n._cb.checked = v;
        n._cb.indeterminate = false;
      }
    }
  }
  function refreshFolder(n){
    if(n.type === "file") return { total: 0, checked: 0 };
    var total = 0, checked = 0;
    n.children.forEach(function(c){
      if(c.type === "file"){
        total++;
        if(c.checked) checked++;
      } else {
        var r = refreshFolder(c);
        total += r.total;
        checked += r.checked;
      }
    });
    if(n._cb && n !== tree){
      n._cb.checked = total > 0 && checked === total;
      n._cb.indeterminate = checked > 0 && checked < total;
    }
    return { total: total, checked: checked };
  }
  function collect(n, out){
    if(n.type === "file"){
      if(n.checked) out.push(n);
      return;
    }
    n.children.forEach(function(c){ collect(c, out); });
  }
  function updateCount(){
    if(!tree) return;
    var s = [];
    collect(tree, s);
    var t = countFiles(tree);
    countEl.textContent = s.length + " / " + t;
    allCb.checked = s.length > 0 && s.length === t;
    allCb.indeterminate = s.length > 0 && s.length < t;
  }
  function buildTree(entries){
    var root = { type: "dir", name: "", path: "", children: [], expanded: true };
    var idx = {};
    idx[""] = root;
    function ensure(p, name){
      if(idx[p]) return idx[p];
      var i = p.lastIndexOf("/");
      var par = i >= 0 ? p.slice(0, i) : "";
      var nm = name || p.slice(i + 1);
      var parent = ensure(par, "");
      var node = { type: "dir", name: nm, path: p, children: [], expanded: false };
      parent.children.push(node);
      idx[p] = node;
      return node;
    }
    entries.forEach(function(e){ if(e.isDir) ensure(e.relPath, e.name); });
    entries.forEach(function(e){
      if(e.isDir) return;
      var i = e.relPath.lastIndexOf("/");
      var par = i >= 0 ? e.relPath.slice(0, i) : "";
      var parent = ensure(par, "");
      parent.children.push({
        type: "file", name: e.name, url: e.url, path: e.relPath, checked: true
      });
    });
    function sort(n){
      n.children.sort(function(a, b){
        if(a.type !== b.type) return a.type === "dir" ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      n.children.forEach(sort);
    }
    sort(root);
    return root;
  }

  function renderNode(node){
    var li = document.createElement("li");
    li.className = "tree-item";
    var row = document.createElement("div");
    row.className = "tree-row" + (node.type === "dir" ? " dir" : "");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = true;

    if(node.type === "file"){
      cb.checked = node.checked;
      cb.addEventListener("change", function(){
        node.checked = cb.checked;
        refreshFolder(tree);
        updateCount();
      });
    } else {
      cb.addEventListener("change", function(){
        setChecked(node, cb.checked);
        refreshFolder(tree);
        updateCount();
      });
    }

    var tri = document.createElement("span");
    tri.className = "tree-tri";

    var dot = document.createElement("span");
    dot.className = "tree-dot" + (node.type === "dir" ? " dir" : "");

    var nm = document.createElement("span");
    nm.className = "tree-name" + (node.type === "dir" ? " dir" : "");
    nm.textContent = node.type === "dir" ? node.name + "/" : node.name;

    var sz = document.createElement("span");
    sz.className = "tree-size";
    sz.textContent = node.type === "dir" ? "(" + countFiles(node) + ")" : "-";

    row.appendChild(cb);
    row.appendChild(tri);
    row.appendChild(dot);
    row.appendChild(nm);
    row.appendChild(sz);
    li.appendChild(row);

    node._cb = cb;
    node._dot = dot;
    node._sz = sz;

    if(node.type === "dir" && node.children.length){
      tri.textContent = node.expanded ? "v" : ">";
      var sub = document.createElement("ul");
      sub.className = "tree-children" + (node.expanded ? " open" : "");
      node.children.forEach(function(c){ sub.appendChild(renderNode(c)); });
      li.appendChild(sub);
      node._sub = sub;
      node._tri = tri;

      row.addEventListener("click", function(ev){
        var t = ev.target;
        if(t && t.tagName === "INPUT") return;
        node.expanded = !node.expanded;
        tri.textContent = node.expanded ? "v" : ">";
        if(node.expanded) sub.classList.add("open");
        else sub.classList.remove("open");
      });
    } else if(node.type === "dir"){
      tri.textContent = ".";
    }

    return li;
  }

  function renderTree(){
    list.textContent = "";
    if(!tree) return;
    var ul = document.createElement("ul");
    ul.className = "tree-list";
    tree.children.forEach(function(c){ ul.appendChild(renderNode(c)); });
    list.appendChild(ul);
    updateCount();
  }

  function busy(on){
    btn.disabled = zipBtn.disabled = dirI.disabled = srvToggle.disabled = proxyToggle.disabled = allCb.disabled = on;
    var s = btn.querySelector(".spinner");
    if(on){
      if(!s){
        s = document.createElement("span");
        s.className = "spinner";
        btn.insertBefore(s, lbl);
      }
      lbl.textContent = "Working...";
    } else {
      if(s) s.parentNode.removeChild(s);
      lbl.textContent = "Load tree";
    }
  }

  function finalize(entries, stats){
    if(!entries.length){
      setStatus("err", "Nothing found");
      busy(0);
      return;
    }
    tree = buildTree(entries);
    renderTree();
    card.hidden = false;
    actionsCard.hidden = false;
    var nf = countFiles(tree);
    var nd = countDirs(tree);
    metaEl.textContent = nf + " files - " + nd + " dirs";
    chipEl.textContent = nf + " files";
    barEl.classList.remove("indet");
    barEl.classList.add("done");
    barFill.style.width = "100%";
    pLeft.textContent = nf + " files";
    pRight.textContent = "";
    var msg = "Loaded " + nf + " files / " + nd + " dirs";
    if(stats && stats.scanned) msg += " (" + stats.scanned + " reqs)";
    if(stats && stats.aborted) msg += " - partial";
    setStatus("ok", msg);
    busy(0);
  }

  function runServer(rawUrl){
    setStatus("load", "Server scanning...");
    barEl.classList.add("indet");
    getJSON(LIST_REMOTE + "?url=" + encodeURIComponent(rawUrl)).then(function(r){
      if(!r.ok) throw new Error((r.data && r.data.error) || "HTTP " + r.status);
      var entries = (r.data.files || []).map(function(f){
        return { isDir: false, url: f.url, name: f.name, relPath: f.relPath };
      });
      finalize(entries, r.data.stats);
    }).catch(function(e){
      barEl.classList.remove("indet");
      barEl.classList.add("fail");
      setStatus("err", "Failed: " + e.message);
      busy(0);
    });
  }

  function runClient(rawUrl){
    var root = new URL(rawUrl);
    if(root.pathname.slice(-1) !== "/") root.pathname += "/";
    var rp = root.pathname;
    var queue = [root.href], seen = {}, entries = [];
    seen[root.href] = 1;
    function step(){
      if(!queue.length){ finalize(entries, null); return; }
      var u = queue.shift();
      setStatus("load", "Scanning " + new URL(u).pathname + " (" + entries.length + ")");
      getText(fetchUrl(u, proxyToggle.checked)).then(function(html){
        if(!/<a\s/i.test(html)){ step(); return; }
        parseIndex(html, u).forEach(function(e){
          var up = new URL(e.url);
          if(up.pathname.indexOf(rp) !== 0) return;
          var rel = up.pathname.slice(rp.length);
          try { rel = decodeURIComponent(rel); } catch(x){}
          if(rel.slice(-1) === "/") rel = rel.slice(0, -1);
          if(!rel) return;
          entries.push({ isDir: e.isDir, url: e.url, name: e.name, relPath: rel });
          if(e.isDir && !seen[e.url]){
            seen[e.url] = 1;
            queue.push(e.url);
          }
        });
        step();
      }).catch(function(e){
        setStatus("err", "Failed: " + e.message);
        busy(0);
      });
    }
    step();
  }

  function run(){
    var u = dirI.value.trim(), p;
    try { p = new URL(u); } catch(e){ setStatus("err", "Invalid URL"); return; }
    if(p.protocol !== "http:" && p.protocol !== "https:"){ setStatus("err", "Only http(s)"); return; }
    busy(1);
    showProgress(true);
    resetProgress();
    card.hidden = true;
    actionsCard.hidden = true;
    list.textContent = "";
    tree = null;
    if(srvToggle.checked) runServer(u);
    else runClient(u);
  }

  function doZip(){
    if(!tree){ setStatus("err", "Load tree first"); return; }
    var sel = [];
    collect(tree, sel);
    if(!sel.length){ setStatus("err", "None selected"); return; }
    busy(1);
    setStatus("load", "Downloading " + sel.length + " files");
    showProgress(true);
    var files = [], i = 0, ok = 0, fail = 0;
    var proxy = proxyToggle.checked;
    function next(){
      if(i >= sel.length){
        if(!files.length){ setStatus("err", "All downloads failed"); busy(0); return; }
        var z = makeZip(files);
        var parts = new URL(dirI.value.trim()).pathname.split("/").filter(Boolean);
        var base = parts.length ? parts[parts.length - 1] : "assets";
        dl(z, safeName(base) + ".zip");
        chipEl.textContent = fmt(z.size);
        setStatus(ok ? "ok" : "err", "ZIP " + fmt(z.size) + " - " + ok + " ok, " + fail + " failed");
        busy(0);
        return;
      }
      var f = sel[i];
      setStatus("load", "File " + (i + 1) + "/" + sel.length + " - " + f.path);
      resetProgress();
      barEl.classList.add("indet");
      if(f._dot) f._dot.className = "tree-dot loading";
      getWithProgress(fetchUrl(f.url, proxy), setProgress).then(function(r){
        return r.blob.arrayBuffer().then(function(buf){
          var data = new Uint8Array(buf);
          files.push({ name: f.path || f.name, data: data });
          ok++;
          barEl.classList.remove("indet");
          barEl.classList.add("done");
          barFill.style.width = "100%";
          if(f._dot) f._dot.className = "tree-dot ok";
          if(f._sz) f._sz.textContent = fmt(data.length);
        });
      }).catch(function(){
        fail++;
        barEl.classList.remove("indet", "done");
        barEl.classList.add("fail");
        if(f._dot) f._dot.className = "tree-dot err";
      }).then(function(){ i++; next(); });
    }
    next();
  }

  btn.addEventListener("click", run);
  zipBtn.addEventListener("click", doZip);
  dirI.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); run(); } });
  allCb.addEventListener("change", function(){
    if(!tree) return;
    setChecked(tree, allCb.checked);
    tree.children.forEach(function(c){
      if(c._cb){ c._cb.checked = allCb.checked; c._cb.indeterminate = false; }
    });
    updateCount();
  });
})();
console.log("[boot] block 3 ok");
</script>

      if(!s){
        s = document.createElement("span");
        s.className = "spinner";
        btn.insertBefore(s, lbl);
      }
      lbl.textContent = "Working...";
    } else {
      if(s) s.parentNode.removeChild(s);
      lbl.textContent = "List JS files";
    }
  }

  function render(files){
    list.textContent = "";
    items = files.map(function(f){ f.checked = true; return f; });
    items.forEach(function(f){
      var li = document.createElement("li");
      li.className = "font-item";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      cb.addEventListener("change", function(){ f.checked = cb.checked; upd(); });
      var nm = document.createElement("span");
      nm.className = "fname";
      nm.textContent = f.name;
      li.appendChild(cb); li.appendChild(nm);
      list.appendChild(li);
      f._cb = cb;
    });
    card.hidden = false;
    actionsCard.hidden = false;
    upd();
  }

  function upd(){
    var s = items.filter(function(f){ return f.checked; }).length;
    countEl.textContent = s + " / " + items.length;
    allCb.checked = s > 0 && s === items.length;
    allCb.indeterminate = s > 0 && s < items.length;
  }

  function run(){
    var u = dirI.value.trim(), p;
    try { p = new URL(u); } catch(e){ setStatus("err", "Invalid URL"); return; }
    if(p.protocol !== "http:" && p.protocol !== "https:"){ setStatus("err", "Only http(s)"); return; }

    busy(1);
    showProgress(true);
    resetProgress();
    barEl.classList.add("indet");
    card.hidden = true;
    actionsCard.hidden = true;
    list.textContent = "";
    items = [];
    setStatus("load", "Listing " + p.hostname);

    getText(fetchUrl(u, proxyToggle.checked)).then(function(html){
      if(!/<a\s/i.test(html)) throw new Error("Not a directory index");
      var entries = parseIndex(html, u);
      var files = [];
      entries.forEach(function(e){
        if(e.isDir) return;
        if(!/\.js(\?|#|$)/i.test(e.url)) return;
        files.push({ url: e.url, name: e.name });
      });
      files.sort(function(a, b){ return a.name.localeCompare(b.name); });

      barEl.classList.remove("indet");
      barEl.classList.add("done");
      barFill.style.width = "100%";
      pLeft.textContent = files.length + " files";
      pRight.textContent = "";

      if(!files.length){ setStatus("err", "No .js files"); busy(0); return; }
      render(files);
      metaEl.textContent = files.length + " files";
      chipEl.textContent = files.length + " files";
      setStatus("ok", "Found " + files.length);
      busy(0);
    }).catch(function(e){
      barEl.classList.remove("indet");
      barEl.classList.add("fail");
      setStatus("err", "Failed: " + e.message);
      busy(0);
    });
  }

  function doZip(){
    var sel = items.filter(function(f){ return f.checked; });
    if(!sel.length){ setStatus("err", "None selected"); return; }
    busy(1);
    showProgress(true);
    var files = [], i = 0, ok = 0, fail = 0;
    var proxy = proxyToggle.checked;
    function next(){
      if(i >= sel.length){
        if(!files.length){ setStatus("err", "All failed"); busy(0); return; }
        var z = makeZip(files);
        var parts = new URL(dirI.value.trim()).pathname.split("/").filter(Boolean);
        var base = parts.length ? parts[parts.length - 1] : "js";
        dl(z, safeName(base) + ".zip");
        chipEl.textContent = fmt(z.size);
        setStatus(ok ? "ok" : "err", "ZIP " + fmt(z.size) + " - " + ok + " ok, " + fail + " failed");
        busy(0);
        return;
      }
      var f = sel[i];
      setStatus("load", "File " + (i + 1) + "/" + sel.length + " - " + f.name);
      resetProgress();
      barEl.classList.add("indet");
      getWithProgress(fetchUrl(f.url, proxy), setProgress).then(function(r){
        return r.blob.arrayBuffer().then(function(buf){
          files.push({ name: f.name, data: new Uint8Array(buf) });
          ok++;
          barEl.classList.remove("indet");
          barEl.classList.add("done");
          barFill.style.width = "100%";
        });
      }).catch(function(){
        fail++;
        barEl.classList.remove("indet", "done");
        barEl.classList.add("fail");
      }).then(function(){ i++; next(); });
    }
    next();
  }

  btn.addEventListener("click", run);
  zipBtn.addEventListener("click", doZip);
  dirI.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); run(); } });
  allCb.addEventListener("change", function(){
    items.forEach(function(f){ f.checked = allCb.checked; if(f._cb) f._cb.checked = allCb.checked; });
    upd();
  });
})();
console.log("[boot] block 4 ok");
</script>
